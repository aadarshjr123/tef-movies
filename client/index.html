<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover movies and TV shows: trailers, cast, episode guides and where to watch."
    />
    <meta name="theme-color" content="#131A27" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <title>TEF Movies</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem("tef-theme");
        var dark = saved ? saved === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

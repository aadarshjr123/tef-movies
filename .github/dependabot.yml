# Weekly pull requests for minor and patch updates, so fixes arrive without
# manual checks. Major upgrades change APIs and are done deliberately;
# security alerts still report vulnerabilities in any version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

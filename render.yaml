# Render blueprint for the API: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tef-movies-api
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
